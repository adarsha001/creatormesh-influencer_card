<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creator Report Card | CreatorMesh | Enlarged & Clarity Boost</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

:root {
  --primary-accent: #6366f1;
  --secondary-accent: #a855f7;
  --glow-color: rgba(147, 51, 234, 0.2);
  --card-bg: #0B0813;
  --border-glow: rgba(168, 85, 247, 0.25);
  --text-white: #ffffff;
  --text-dim: rgba(255,255,255,0.7);
  --text-muted: rgba(255,255,255,0.5);
  --border-subtle: rgba(255, 255, 255, 0.06);
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background:#0a0a0c;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  font-family:'Inter', sans-serif;
  padding: 32px;
}

/* CARD FULL UTILIZATION - ENLARGED BY 20% (scale factor) */
.card {
  width: 1700px;   /* 1220px * 1.2 = 1464px */
  height: auto;
  min-height: 1620px; /* 1350px * 1.2 = 1620px (approx) */
  background: var(--card-bg);
  position: relative;
  display: flex;
  flex-direction: column;
  padding: 58px 64px 62px 64px;  /* slightly increased padding for breath */
  transition: all 0.5s ease;

  
  box-shadow: 0 30px 50px -20px rgba(0,0,0,0.8);
}

/* Enhanced glow scaled subtly */
.glow-bg {
  position: absolute;
  top: -200px;
  right: -180px;
  width: 850px;
  height: 850px;
  background: radial-gradient(circle, var(--glow-color) 0%, rgba(0,0,0,0) 72%);
  z-index: 0;
  pointer-events: none;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 5;
  border-bottom: 1px solid var(--border-subtle);
  padding-bottom: 32px;
  margin-bottom: 32px;
  position: relative;
}

.logo img {
  width: 186px;  /* scaled up from 156px for bigger presence */
  height: auto;
  border-radius: 16px;
  filter: drop-shadow(0 6px 14px rgba(0,0,0,0.4));
}

.report-badge {
  background: linear-gradient(135deg, var(--primary-accent), var(--secondary-accent));
  color: #fff;
  font-weight: 800;
  font-size: 1.45rem;   /* bigger text */
  padding: 14px 34px;
  border-radius: 70px;
  letter-spacing: 1.5px;
  box-shadow: 0 8px 20px var(--border-glow);
  backdrop-filter: blur(2px);
}

.main-layout {
  display: flex;
  flex-direction: column;
  gap: 36px;  /* increased gap for clarity */
  z-index: 5;
  flex: 1;
}

/* Row 1: Quick Stats (3 items) - BIGGER STATS */
.top-row {
  display: flex;
  gap: 28px;
  width: 100%;
}

.quick-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 28px;
  width: 100%;
}

.quick-stat-card {
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.07);
  border-radius: 28px;
  padding: 32px 20px;
  text-align: center;
  transition: all 0.2s;
  backdrop-filter: blur(4px);
}

.quick-stat-card .label {
  font-size: 0.9rem;    /* increased readability */
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-bottom: 16px;
}

.quick-stat-card .value {
  font-size: 2.6rem;    /* bigger than before (2rem) */
  font-weight: 800;
  color: #fff;
  line-height: 1.2;
  word-break: break-word;
  letter-spacing: -0.01em;
}

/* Row 2: Languages + Core Metrics (2 cards: View-to-Follower + LVR) */
.metrics-row {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 32px;
}

/* --- LANGUAGE COMPACT CARD - MAJOR TEXT UPGRADE --- */
.languages-compact {
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.07);
  border-radius: 28px;
  padding: 34px 28px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.languages-compact .label {
  font-size: 0.9rem;      /* larger & crisp */
  font-weight: 800;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-bottom: 20px;
}

.lang-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;   /* more breathing space */
}

.lang-pill {
  background: rgba(255,255,255,0.12);
  border-radius: 60px;
  padding: 12px 28px;     /* MUCH bigger pills for language text */
  font-size: 3.25rem;     /* significantly bigger font for language readability */
  font-weight: 600;
  color: #fff;
  backdrop-filter: blur(2px);
  letter-spacing: 0.3px;
}

/* Metric cards (2) */
.metric-card {
  background: rgba(255, 255, 255, 0.02);
  border-radius: 32px;
  padding: 38px 24px;
  text-align: center;
  transition: all 0.25s ease;
  border-left: 6px solid;
  backdrop-filter: blur(2px);
  box-shadow: 0 8px 20px rgba(0,0,0,0.2);
}

.metric-card .label {
  font-size: 1rem;        /* bigger label */
  text-transform: uppercase;
  letter-spacing: 2.5px;
  font-weight: 700;
  margin-bottom: 20px;
  color: var(--text-dim);
}

.metric-card .value {
  font-size: 4rem;        /* increased from 3.2rem for impact */
  font-weight: 900;
  margin-bottom: 16px;
  letter-spacing: -0.02em;
}

.metric-card .status {
  font-size: 1rem;        /* boosted status text */
  font-weight: 700;
  letter-spacing: 0.5px;
}

/* Row 3: Community Insight + Price */
.community-price-row {
  display: grid;
  grid-template-columns: 2.2fr 1fr;
  gap: 32px;
}

.community-insight-card {
  background: rgba(0, 255, 206, 0.05);
  border: 1px solid rgba(0, 255, 206, 0.25);
  border-radius: 32px;
  padding: 40px 40px;
}

.community-insight-card .label {
  color: #00FFCE;
  font-size: 1.5rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 2.5px;
  margin-bottom: 18px;
}

.community-insight-card .score {
  font-size: 3.6rem;      /* large score display */
  font-weight: 900;
  color: #00FFCE;
  margin-bottom: 20px;
  letter-spacing: -0.02em;
}

.community-insight-card .insight {
  font-size: 2.15rem;     /* enhanced body text */
  color: rgba(255,255,255,0.9);
  line-height: 1.55;
  font-weight: 460;
}

.price-card {
  background: linear-gradient(135deg, rgba(255,215,0,0.12) 0%, rgba(255,215,0,0.02) 100%);
  border: 1px solid rgba(255,215,0,0.3);
  border-radius: 32px;
  padding: 40px 28px;
  text-align: center;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.price-card .label {
  font-size: 1rem;
  color: rgba(255,215,0,0.85);
  text-transform: uppercase;
  letter-spacing: 2.5px;
  font-weight: 700;
  margin-bottom: 16px;
}

.price-card .value {
  font-size: 4rem;         /* bigger price */
  font-weight: 900;
  color: #FFD700;
  letter-spacing: -0.02em;
}

.price-card .note {
  font-size: 0.9rem;
  color: var(--text-muted);
  margin-top: 18px;
  font-weight: 500;
}

/* Row 4: Strategic Verdict */
.verdict-card {
  background: linear-gradient(135deg, rgba(255,255,255,0.02) 0%, rgba(255,255,255,0.07) 100%);
  border-left: 7px solid var(--primary-accent);
  padding: 42px 48px;
  border-radius: 32px;
  margin-top: 6px;
  backdrop-filter: blur(2px);
}

.verdict-card h3 {
  color: var(--primary-accent);
  font-size: 1.25rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 3px;
  margin-bottom: 20px;
}

.verdict-card p {
  font-size: 4.3rem;      /* drastically bigger verdict text */
  font-weight: 550;
  line-height: 1.45;
  color: #fff;
  letter-spacing: -0.2px;
}

/* Footer CTA */
.footer-cta {
  border-top: 1px solid var(--border-subtle);
  padding-top: 36px;
  margin-top: 36px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.cta-text { 
  font-size: 1.8rem; 
  font-weight: 600;
  color: rgba(255,255,255,0.9);
}
.cta-text strong { 
  color: var(--primary-accent);
  background: rgba(255,255,255,0.08);
  padding: 5px 16px;
  border-radius: 60px;
  margin-left: 8px;
  font-weight: 800;
}
.social-handle { 
  font-size: 1.15rem; 
  font-weight: 700; 
  color: #fff; 
  opacity: 0.7;
  letter-spacing: 0.8px;
}

/* Responsive adjustments for large card scale (maintains readability on 1440p+) */
@media (max-width: 1600px) {
  .card {
    width: 92%;
    padding: 48px 52px 52px 52px;
  }
  .lang-pill {
    font-size: 1.1rem;
    padding: 10px 24px;
  }
  .metric-card .value {
    font-size: 3.6rem;
  }
  .verdict-card p {
    font-size: 1.5rem;
  }
}

@media (max-width: 1300px) {
  .card {
    width: 96%;
    padding: 40px 36px;
  }
  .quick-stat-card .value {
    font-size: 2.2rem;
  }
  .lang-pill {
    font-size: 1rem;
    padding: 8px 20px;
  }
  .metric-card .value {
    font-size: 3rem;
  }
  .community-insight-card .score {
    font-size: 3.8rem;
  }
  .price-card .value {
    font-size: 3.2rem;
  }
}

</style>
</head>

<body>

<div class="card" id="mainCard">
  <div class="glow-bg"></div>

  <div class="header">
    <div class="logo">
      <img src="https://res.cloudinary.com/dq32mhbbt/image/upload/v1776751976/Untitled_900_x_1536_px_800_x_800_px_ntonbn.png" alt="CreatorMesh" />
    </div>
    <div class="report-badge" id="reportIdBadge">REPORT: #018</div>
  </div>

  <div class="main-layout">
    
    <!-- Row 1: ONLY Followers, Location, Category -->
    <div class="top-row">
      <div class="quick-stats">
        <div class="quick-stat-card">
          <div class="label">👥 FOLLOWERS</div>
          <div class="value" id="statFollowers">--</div>
        </div>
        <div class="quick-stat-card">
          <div class="label">📍 LOCATION</div>
          <div class="value" id="statLocation">--</div>
        </div>
        <div class="quick-stat-card">
          <div class="label">🏷️ CATEGORY</div>
          <div class="value" id="statCategory">--</div>
        </div>
      </div>
    </div>

    <!-- Row 2: Languages + View-to-Follower + Like-to-View (LVR) ONLY -->
    <div class="metrics-row">
      <div class="languages-compact">
        <div class="label">🌐 LANGUAGES SPOKEN</div>
        <div class="lang-pills" id="languageContainer">
          <span class="lang-pill">English</span>
        </div>
      </div>

      <div class="metric-card" id="viewRatioCard">
        <div class="label">👁️ VIEW-TO-FOLLOWER</div>
        <div class="value" id="viewRatioValue">--</div>
        <div class="status" id="viewRatioStatus">--</div>
      </div>

      <div class="metric-card" id="lvrCard">
        <div class="label">❤️ LIKE-TO-VIEW (LVR)</div>
        <div class="value" id="lvrValue">--</div>
        <div class="status" id="lvrStatus">--</div>
      </div>
    </div>

    <!-- Row 3: Community Insight + Price -->
    <div class="community-price-row">
      <div class="community-insight-card">
        <div class="label">📊 COMMUNITY INSIGHT</div>
        <div class="score" id="commScore">--</div>
        <div class="insight" id="commInsight">Loading community insight...</div>
      </div>
      
      <div class="price-card">
        <div class="label">💰 BRAND COLLABORATION</div>
        <div class="value" id="companyPrice">--</div>
      </div>
    </div>

    <!-- Row 4: Strategic Verdict -->
    <!-- <div class="verdict-card">
      <h3>🎯 STRATEGIC VERDICT</h3>
      <p id="strategicVerdict">Loading strategic verdict...</p>
    </div> -->

  </div>

  <div class="footer-cta">
    <div class="cta-text">Book Creator <strong id="ctaId">#018</strong> for your next campaign</div>
    <div class="social-handle">@creatormesh.india</div>
  </div>
</div>

<script>
(function () {
  const params = new URLSearchParams(window.location.search);
  
  // Neutral dynamic: all styles based on purple/indigo/gold/teal, no gender theming.

  function setText(id, value) {
    const el = document.getElementById(id);
    if (el && value !== undefined && value !== null && value !== "") {
      el.innerText = value;
    }
  }

  // --- dynamic color utilities for metric cards (only for the two metric cards) ---
  function getViewRatioColor(vr) {
    const num = parseFloat(vr);
    if (num >= 100) return { color: "#10B981", status: "🚀 Viral Reach", bg: "#10B98108" };
    if (num >= 50) return { color: "#F59E0B", status: "👁️ Strong Visibility", bg: "#F59E0B08" };
    if (num >= 20) return { color: "#F59E0B", status: "🔍 Good Discovery", bg: "#F59E0B08" };
    return { color: "#EF4444", status: "🎯 Niche Focus", bg: "#EF444408" };
  }

  function getLVRColor(lvr) {
    const num = parseFloat(lvr);
    if (num >= 8) return { color: "#10B981", status: "💎 Elite Impact", bg: "#10B98108" };
    if (num >= 4) return { color: "#F59E0B", status: "❤️ Strong Appeal", bg: "#F59E0B08" };
    if (num >= 2) return { color: "#F59E0B", status: "✨ Solid Conversion", bg: "#F59E0B08" };
    return { color: "#EF4444", status: "📌 Initial Traction", bg: "#EF444408" };
  }

  function applyMetricStyle(cardId, value, colorFunction, valueElementId, statusElementId) {
    const card = document.getElementById(cardId);
    const valueEl = document.getElementById(valueElementId);
    const statusEl = document.getElementById(statusElementId);
    const num = parseFloat(value);
    
    if (card && valueEl && !isNaN(num)) {
      const colorData = colorFunction(num);
      card.style.borderLeftColor = colorData.color;
      card.style.background = `linear-gradient(135deg, ${colorData.color}0c 0%, rgba(255,255,255,0.01) 100%)`;
      valueEl.style.color = colorData.color;
      if (statusEl) {
        statusEl.style.color = colorData.color;
        statusEl.innerText = colorData.status;
      }
    }
  }

  // Creator ID
  const creatorId = params.get("id") || "018";
  setText("reportIdBadge", `REPORT: #${creatorId}`);
  setText("ctaId", `#${creatorId}`);

  // --- Values from URL or defaults ---
  const followers = params.get("followers") || "124K";
  const location = params.get("location") || "Mumbai";
  const category = params.get("category") || "Fashion & Beauty";
  const viewRatioRaw = params.get("viewRatio") || "187.45";
  const lvrRaw = params.get("lvr") || "5.91";
  const companyPriceRaw = params.get("companyPrice");
  
  const engagementRaw = params.get("engagement") || "4.82";
  const communityScoreRaw = params.get("commValue") || `${engagementRaw}%`;
  const communityInsightText = params.get("commInsight") || "";
  const strategicVerdictText = params.get("strategicVerdict") || "";

  const engagementNum = parseFloat(engagementRaw);
  const viewRatioNum = parseFloat(viewRatioRaw);
  const lvrNum = parseFloat(lvrRaw);
  
  const viewRatioDisplay = isNaN(viewRatioNum) ? "230.99%" : `${viewRatioNum}%`;
  const lvrDisplay = isNaN(lvrNum) ? "1.15%" : `${lvrNum}%`;

  // Set Quick Stats
  setText("statFollowers", followers);
  setText("statLocation", location);
  setText("statCategory", category);

  // Set metric values
  setText("viewRatioValue", viewRatioDisplay);
  setText("lvrValue", lvrDisplay);

  // Apply dynamic styles to View Ratio and LVR cards
  if (!isNaN(viewRatioNum)) applyMetricStyle("viewRatioCard", viewRatioNum, getViewRatioColor, "viewRatioValue", "viewRatioStatus");
  if (!isNaN(lvrNum)) applyMetricStyle("lvrCard", lvrNum, getLVRColor, "lvrValue", "lvrStatus");

  // --- Community Insight Block (score + insight)---
  const communityScoreFinal = communityScoreRaw.includes('%') ? communityScoreRaw : `${communityScoreRaw}%`;
  setText("commScore", communityScoreFinal);
  
  if (communityInsightText && communityInsightText.trim() !== "") {
    setText("commInsight", communityInsightText);
  } else {
    let insightMsg = `A ${category.toLowerCase()} community in ${location} with ${engagementNum}% engagement, reflecting authentic interest in premium brand collaborations. High trust index.`;
    if (viewRatioNum > 100) insightMsg = `🔥 Viral momentum! ${location}'s top creator with ${viewRatioNum}% view ratio — audience actively shares content, ideal for high-reach D2C campaigns.`;
    else if (lvrNum > 6) insightMsg = `💎 Ultra-loyal community: ${lvrNum}% like-to-view ratio shows deep resonance. Perfect for storytelling & brand loyalty programs.`;
    else if (engagementNum > 3.5) insightMsg = `📈 Solid engagement (${engagementNum}%) combined with metro location (${location}) drives premium brand recall. Audience highly responsive.`;
    setText("commInsight", insightMsg);
  }

  // --- Strategic Verdict ---
  if (strategicVerdictText && strategicVerdictText.trim() !== "") {
    setText("strategicVerdict", strategicVerdictText);
  } else {
    let verdict = `${location}-based creator delivering ${viewRatioNum}% view ratio with ${engagementNum}% engagement — ideal for lifestyle, D2C & digital-first brands targeting India's affluent young audience.`;
    if (viewRatioNum > 150) verdict = `📢 BREAKTHROUGH ALERT: ${location}'s high-velocity creator reaches ${viewRatioNum}% view-to-follower ratio. Strategic fit for product launches & festival campaigns.`;
    else if (lvrNum > 7) verdict = `🏆 Top 5% in LVR! Exceptional like conversion of ${lvrNum}% drives emotional connection. Brands seeking advocacy & UGC will see outstanding ROI.`;
    else if (engagementNum >= 4) verdict = `🎯 PERFORMANCE POWERHOUSE: ${engagementNum}% engagement + metro influence in ${location}. Commanding presence for beauty, tech & fashion narratives.`;
    setText("strategicVerdict", verdict);
  }

  // --- Brand Collaboration Price (dynamic smart pricing)---
  if (companyPriceRaw && !isNaN(parseFloat(companyPriceRaw))) {
    const priceNum = parseInt(companyPriceRaw);
    const formattedPrice = `₹${priceNum.toLocaleString('en-IN')}`;
    setText("companyPrice", formattedPrice);
  } else if (companyPriceRaw && companyPriceRaw !== "") {
    setText("companyPrice", companyPriceRaw);
  } else {
    let estimatedPrice = 45000;
    const followerNum = typeof followers === 'string' ? parseFloat(followers.replace(/[^0-9.]/g, '')) : 50;
    const followerVal = isNaN(followerNum) ? 50 : (followers.includes('K') ? followerNum * 1000 : followerNum);
    if (followerVal > 200000) estimatedPrice = 185000;
    else if (followerVal > 80000) estimatedPrice = 89000;
    else if (followerVal > 30000) estimatedPrice = 54000;
    else estimatedPrice = 35000;
    if (engagementNum > 6) estimatedPrice = estimatedPrice * 1.4;
    setText("companyPrice", `₹${Math.round(estimatedPrice).toLocaleString('en-IN')}`);
  }

  // --- Languages Parsing (improved readability and bigger pills)---
  const langs = params.get("languages");
  const container = document.getElementById("languageContainer");
  
  function renderLanguagePills(langArray) {
    container.innerHTML = "";
    langArray.forEach(lang => {
      const trimmed = lang.trim();
      if(trimmed) {
        const pill = document.createElement("span");
        pill.className = "lang-pill";
        pill.innerText = trimmed;
        container.appendChild(pill);
      }
    });
    if (container.children.length === 0) {
      const pill = document.createElement("span");
      pill.className = "lang-pill";
      pill.innerText = "English";
      container.appendChild(pill);
    }
  }

  if (langs && langs.trim() !== "") {
    const langArray = langs.split(",").map(l => l.trim());
    renderLanguagePills(langArray);
  } else {
    // Smart defaults based on location for broader representation
    let defaultLangSet = ["English", "Hindi"];
    const locLower = location.toLowerCase();
    if (locLower.includes("bangalore") || locLower.includes("bengaluru")) defaultLangSet = ["English", "Kannada", "Hindi"];
    else if (locLower.includes("mumbai") || locLower.includes("delhi") || locLower.includes("ncr")) defaultLangSet = ["English", "Hindi"];
    else if (locLower.includes("kolkata")) defaultLangSet = ["English", "Bengali"];
    else if (locLower.includes("chennai")) defaultLangSet = ["English", "Tamil"];
    else if (locLower.includes("hyderabad")) defaultLangSet = ["English", "Telugu", "Urdu"];
    else if (locLower.includes("pune")) defaultLangSet = ["English", "Marathi", "Hindi"];
    renderLanguagePills(defaultLangSet);
  }

  // Ensure status texts are correctly populated for edge cases
  if (document.getElementById("viewRatioStatus").innerText === "--" && !isNaN(viewRatioNum)) {
    const colData = getViewRatioColor(viewRatioNum);
    const statusEl = document.getElementById("viewRatioStatus");
    if(statusEl) {
      statusEl.innerText = colData.status;
      statusEl.style.color = colData.color;
    }
  }
  if (document.getElementById("lvrStatus").innerText === "--" && !isNaN(lvrNum)) {
    const colData = getLVRColor(lvrNum);
    const statusEl = document.getElementById("lvrStatus");
    if(statusEl) {
      statusEl.innerText = colData.status;
      statusEl.style.color = colData.color;
    }
  }

  // Additionally increase the visual presence of language pill text dynamically if needed (already bigger via CSS)
  // Ensure any dynamic insight uses large line height
})();
</script>
</body>
</html>
